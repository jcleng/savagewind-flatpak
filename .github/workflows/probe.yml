name: Probe sandbox paths
permissions:
  contents: read
on:
  workflow_dispatch:
env:
  APP_ID: com.revivedx.SavageWind
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.APP_ID }}.flatpak
          manifest-path: ${{ env.APP_ID }}.yaml
          repository-name: flathub
          branch: stable
          upload-artifact: false
      - name: Install and probe
        run: |
          flatpak install --user --noninteractive --bundle "${APP_ID}.flatpak"
          P() { flatpak run --command=sh "${APP_ID}" -c "$1" || echo "(exit $?)"; }
          echo "===== 1. /usr 是只读 tmpfs/overlay? ====="
          P 'mount | grep -E " / | /usr " ; echo; touch /usr/share/fonts/.w 2>&1; echo "write-to-/usr exit=$?"'
          echo "===== 2. /usr/share/fonts 挂载来源 ====="
          P 'grep " /usr/share" /proc/self/mountinfo'
          echo "===== 3. /app/share/fonts 是否 symlink 进 /usr/share ====="
          P 'ls -la /usr/share | grep -iE "font|^total" ; ls -la /usr/share/fonts'
          echo "===== 4. FONTCONFIG 文件里的字体目录 ====="
          P 'grep -r "<dir" /etc/fonts/conf.d/ 2>/dev/null | head -20'
          echo "===== 5. /run/host ====="
          P 'ls -la /run/host 2>&1 | head'
