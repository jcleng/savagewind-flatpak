name: Build Flatpak

# 创建 Release 需要写权限（默认 GITHUB_TOKEN 为只读）
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'com.revivedx.SavageWind.yaml'
      - 'savagewind-wrapper'
      - 'com.revivedx.SavageWind.desktop'
      - 'com.revivedx.SavageWind.metainfo.xml'
      - 'icons/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 Release'
        type: boolean
        required: false
        default: true

env:
  SAVAGEWIND_VERSION: "0.5.0-alpha.5"
  APP_ID: com.revivedx.SavageWind

jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      # 与清单中的 runtime org.freedesktop.Platform 25.08 对应
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先用带重试的 curl 把上游 AppImage 拉下来，再让 flatpak-builder 直接吃本地文件，
      # 避免上游 release CDN 的 504 抖动打断整个构建。
      - name: Prefetch upstream AppImage
        run: |
          set -eu
          URL="https://github.com/Revivedx/SavageWindRecomp/releases/download/v${SAVAGEWIND_VERSION}/Savage_Wind-${SAVAGEWIND_VERSION}-x86_64.AppImage"
          SHA=$(grep -A2 'Savage_Wind-.*x86_64.AppImage' "${APP_ID}.yaml" | grep sha256 | head -1 | awk '{print $2}')
          test -n "$SHA"
          echo "expect sha256: $SHA"
          for i in $(seq 1 10); do
            echo "::group::attempt $i"
            if curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --max-time 900 -o upstream.AppImage "$URL"; then
              if echo "$SHA  upstream.AppImage" | sha256sum -c -; then
                echo "::endgroup::"
                ls -lh upstream.AppImage
                exit 0
              fi
              echo "checksum mismatch, retrying"
            fi
            echo "::endgroup::"
            sleep 10
          done
          echo "::error::无法下载上游 AppImage（多次重试后仍失败）"
          exit 1

      - name: Patch manifest to local source
        run: |
          set -eu
          python3 - <<'PY'
          import os, re
          app = os.environ['APP_ID']
          manifest = f'{app}.yaml'
          text = open(manifest).read()
          # 把 remote file source 换成同目录下的本地文件（flatpak-builder 支持 type: file + path）
          pattern = re.compile(
              r'- type: file\n\s+url: https://github\.com/Revivedx/SavageWindRecomp/releases/download/'
              r'[^\n]+\n\s+sha256: [0-9a-f]+\n\s+dest-filename: SavageWind\.appimage\n')
          new = '- type: file\n        path: upstream.AppImage\n        dest-filename: SavageWind.appimage\n'
          text2, n = pattern.subn(new, text)
          assert n == 1, f'expected 1 remote appimage source, patched {n}'
          open(manifest, 'w').write(text2)
          print('manifest patched -> local upstream.AppImage')
          PY
          grep -n -A3 'type: file' "${APP_ID}.yaml" | head -12

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.APP_ID }}.flatpak
          manifest-path: ${{ env.APP_ID }}.yaml
          cache-key: flatpak-builder-savagewind-${{ env.SAVAGEWIND_VERSION }}
          # 上游 AppImage 已含编译产物与工具链，缓存命中可显著加速
          repository-name: flathub
          branch: stable
          upload-artifact: false

      - name: Verify bundle
        run: |
          set -eu
          ls -lh "${APP_ID}.flatpak"
          echo "bundle size: $(stat -c %s "${APP_ID}.flatpak") bytes"
          # 校验 bundle 可被 flatpak 正确识别
          flatpak install --user --noninteractive --bundle "${APP_ID}.flatpak" || {
            echo "::error::bundle 安装校验失败"
            exit 1
          }
          flatpak list --app --columns=application,branch

      # 装好的沙箱里验证 CJK 字体真的在程序硬编码的路径上且可被解析，
      # 避免以后升级又退化成中文问号却没人发现。
      - name: Verify CJK fonts inside the sandbox
        run: |
          set -eu
          FONT=/usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
          flatpak run --command=sh "${APP_ID}" -c "
            set -eu
            test -r '${FONT}' || { echo 'MISSING: ${FONT}'; exit 1; }
            ls -l '${FONT}' /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
            head -c 4 '${FONT}' | od -An -c
            echo '\$LANG:' \"\$LANG\"; echo '\$LC_ALL:' \"\$LC_ALL\"
          "
          echo '::group::sfnt + CJK glyph check'
          # 在容器里用一个最小 stb_truetype 程序确认能加载并查到汉字
          cat > /tmp/fontcheck.c <<'EOF'
          #define STB_TRUETYPE_IMPLEMENTATION
          #include <stdio.h>
          #include <stdlib.h>
          #include "stb_truetype.h"
          int main(int argc, char **argv) {
            FILE *f = fopen(argv[1], "rb"); if (!f) { perror("open"); return 2; }
            fseek(f, 0, SEEK_END); long n = ftell(f); fseek(f, 0, SEEK_SET);
            unsigned char *d = malloc(n); if (fread(d, 1, n, f) != (size_t)n) return 2;
            fclose(f);
            if (n < 1024) { fprintf(stderr, "file too small: %ld bytes\n", n); return 5; }
            int off = stbtt_GetFontOffsetForIndex(d, 0);
            if (off < 0) { fprintf(stderr, "not an sfnt font (no valid face at index 0)\n"); return 3; }
            stbtt_fontinfo fi;
            if (!stbtt_InitFont(&fi, d, off)) return 3;
            const unsigned cps[] = {0x4E2D, 0x5934, 0x8BBE, 0x7F6E}; /* 中头设置 */
            for (int i = 0; i < 4; i++)
              if (!stbtt_FindGlyphIndex(&fi, cps[i])) { printf("missing U+%04X\n", cps[i]); return 4; }
            printf("ok: sfnt loaded, CJK glyphs present\n");
            return 0;
          }
          EOF
          # 用 flatpak 沙箱里的 runtime 文件（把字体拷出来，在容器内编译检查）
          flatpak run --command=cat "${APP_ID}" "${FONT}" > /tmp/NotoSansCJK-Regular.ttc
          curl -sSL -o /tmp/stb_truetype.h https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h
          cc -O1 -I/tmp -o /tmp/fontcheck /tmp/fontcheck.c -lm
          /tmp/fontcheck /tmp/NotoSansCJK-Regular.ttc
          echo '::endgroup::'

          flatpak uninstall --user -y "${APP_ID}" || true

      - name: Compute checksum
        run: |
          set -eu
          sha256sum "${APP_ID}.flatpak" | tee sha256.txt
          SHA=$(sha256sum "${APP_ID}.flatpak" | awk '{print $1}')
          echo "SHA256_FULL=${SHA}  ${APP_ID}.flatpak" >> "$GITHUB_ENV"

      - name: Generate release notes
        run: |
          set -eu
          DATE=$(date +%Y%m%d)
          TAG=v${SAVAGEWIND_VERSION}-${DATE}
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Savage Wind ${SAVAGEWIND_VERSION} Flatpak (${TAG})" >> "$GITHUB_ENV"
          {
            echo "# Savage Wind Recomp Flatpak"
            echo ""
            echo "> 非官方 Flatpak 封装，直接打包上游官方 AppImage Release，不做源码编译。"
            echo ""
            echo "## 安装方法"
            echo ""
            echo '```bash'
            echo "# 下载 ${APP_ID}.flatpak 后："
            echo "flatpak install --user ${APP_ID}.flatpak"
            echo "flatpak run ${APP_ID}"
            echo '```'
            echo ""
            echo "## 重要提示"
            echo ""
            echo "**本包不含任何游戏文件、密钥或 DUMP 工具。** 你需要自备合法获得的《旷野之息》1.9.0 版 ExeFS / RomFS，"
            echo "首次启动时程序会要求选择目录，并在本机重新编译游戏代码（约 6 分钟起，取决于 CPU）。"
            echo ""
            echo "运行要求：x86-64 CPU（SSE4.2）、Vulkan 1.3 显卡驱动、16 GB 内存、约 20 GB 空闲磁盘。"
            echo ""
            echo "## 说明"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 应用 ID | \`${APP_ID}\` |"
            echo "| 上游版本 | Savage Wind **${SAVAGEWIND_VERSION}** (Alpha 5) |"
            echo "| 运行时 | org.freedesktop.Platform 25.08 |"
            echo "| 构建来源 | 上游官方 AppImage 解包封装 |"
            echo ""
            echo "## 数据目录"
            echo ""
            echo '```'
            echo "~/.var/app/${APP_ID}/data/savagewind   # 日志 / 配置 / 存档 / 已编译游戏库"
            echo '```'
            echo ""
            echo "## 文件校验 (SHA256)"
            echo '```'
            echo "${SHA256_FULL}"
            echo '```'
            echo ""
            echo "## 上游项目"
            echo ""
            echo "- 源码: https://github.com/Revivedx/SavageWindRecomp"
            echo "- Linux 说明: https://github.com/Revivedx/SavageWindRecomp/blob/main/docs/linux.md"
          } > release.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-flatpak
          path: ${{ env.APP_ID }}.flatpak
          retention-days: 14

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ github.workspace }}/release.txt
          files: ${{ github.workspace }}/${{ env.APP_ID }}.flatpak
          overwrite_files: true
