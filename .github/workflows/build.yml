name: Build Flatpak

# 创建 Release 需要写权限（默认 GITHUB_TOKEN 为只读）
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'com.revivedx.SavageWind.yaml'
      - 'savagewind-wrapper'
      - 'savagewind-cjk-path.c'
      - 'com.revivedx.SavageWind.desktop'
      - 'com.revivedx.SavageWind.metainfo.xml'
      - 'icons/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 Release'
        type: boolean
        required: false
        default: true

env:
  SAVAGEWIND_VERSION: "0.5.0-alpha.5"
  APP_ID: com.revivedx.SavageWind

jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      # 与清单中的 runtime org.freedesktop.Platform 25.08 对应
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先用带重试的 curl 把上游 AppImage 拉下来，再让 flatpak-builder 直接吃本地文件，
      # 避免上游 release CDN 的 504 抖动打断整个构建。
      - name: Prefetch upstream AppImage
        run: |
          set -eu
          URL="https://github.com/Revivedx/SavageWindRecomp/releases/download/v${SAVAGEWIND_VERSION}/Savage_Wind-${SAVAGEWIND_VERSION}-x86_64.AppImage"
          SHA=$(grep -A2 'Savage_Wind-.*x86_64.AppImage' "${APP_ID}.yaml" | grep sha256 | head -1 | awk '{print $2}')
          test -n "$SHA"
          echo "expect sha256: $SHA"
          for i in $(seq 1 10); do
            echo "::group::attempt $i"
            if curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --max-time 900 -o upstream.AppImage "$URL"; then
              if echo "$SHA  upstream.AppImage" | sha256sum -c -; then
                echo "::endgroup::"
                ls -lh upstream.AppImage
                exit 0
              fi
              echo "checksum mismatch, retrying"
            fi
            echo "::endgroup::"
            sleep 10
          done
          echo "::error::无法下载上游 AppImage（多次重试后仍失败）"
          exit 1

      - name: Patch manifest to local source
        run: |
          set -eu
          python3 - <<'PY'
          import os, re
          app = os.environ['APP_ID']
          manifest = f'{app}.yaml'
          text = open(manifest).read()
          # 把 remote file source 换成同目录下的本地文件（flatpak-builder 支持 type: file + path）
          pattern = re.compile(
              r'- type: file\n\s+url: https://github\.com/Revivedx/SavageWindRecomp/releases/download/'
              r'[^\n]+\n\s+sha256: [0-9a-f]+\n\s+dest-filename: SavageWind\.appimage\n')
          new = '- type: file\n        path: upstream.AppImage\n        dest-filename: SavageWind.appimage\n'
          text2, n = pattern.subn(new, text)
          assert n == 1, f'expected 1 remote appimage source, patched {n}'
          open(manifest, 'w').write(text2)
          print('manifest patched -> local upstream.AppImage')
          PY
          grep -n -A3 'type: file' "${APP_ID}.yaml" | head -12

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.APP_ID }}.flatpak
          manifest-path: ${{ env.APP_ID }}.yaml
          cache-key: flatpak-builder-savagewind-${{ env.SAVAGEWIND_VERSION }}
          # 上游 AppImage 已含编译产物与工具链，缓存命中可显著加速
          repository-name: flathub
          branch: stable
          upload-artifact: false

      - name: Verify bundle
        run: |
          set -eu
          ls -lh "${APP_ID}.flatpak"
          echo "bundle size: $(stat -c %s "${APP_ID}.flatpak") bytes"
          # 校验 bundle 可被 flatpak 正确识别
          flatpak install --user --noninteractive --bundle "${APP_ID}.flatpak" || {
            echo "::error::bundle 安装校验失败"
            exit 1
          }
          flatpak list --app --columns=application,branch

      # 装好的沙箱里验证 CJK 字体真的能被程序加载到，避免以后升级又退化成中文乱码：
      #   * 游戏内文本（SAVAGEWIND_FONT）必须是 TrueType(glyf) 轮廓 + 含中文——游戏字体引擎
      #     读到 CFF 会崩溃（这也是「设了中文下次打不开」的常见原因）。
      #   * ImGui 界面（SAVAGEWIND_MENU_FONT / SAVAGEWIND_LAUNCHER_FONT）用 stb_truetype 加载。
      # 三个入口都是上游二进制里的环境变量，不依赖 /usr/share/fonts 硬编码路径。
      - name: Verify CJK fonts inside the sandbox
        run: |
          set -eu
          NOTO=/app/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
          WQY=/app/share/fonts/wqy/wqy-microhei.ttc

          echo '::group::fonts present + wrapper sets the env vars'
          flatpak run --command=sh "${APP_ID}" -c "
            set -eu
            test -r '${NOTO}' || { echo 'MISSING: ${NOTO}'; exit 1; }
            test -r '${WQY}'  || { echo 'MISSING: ${WQY}'; exit 1; }
            test -r /app/lib/libsavagewind-cjk-path.so || { echo 'MISSING: cjk-path shim'; exit 1; }
            ls -l '${NOTO}' '${WQY}' /app/lib/libsavagewind-cjk-path.so
            # wrapper 必须引用 shim 与三个字体变量
            grep -n SAVAGEWIND_CJK_SHIM /app/bin/savagewind-wrapper
            grep -n LD_PRELOAD /app/bin/savagewind-wrapper
            grep -n SAVAGEWIND_FONT /app/bin/savagewind-wrapper
            grep -n SAVAGEWIND_MENU_FONT /app/bin/savagewind-wrapper
            grep -n SAVAGEWIND_LAUNCHER_FONT /app/bin/savagewind-wrapper
          "
          echo '::endgroup::'

          # 关键断言：LD_PRELOAD shim 必须把上游写死的 CJK 路径重定向到已安装的字体。
          # 在沙箱里编译并运行一个小程序：不设 LD_PRELOAD 时那两条路径打不开，
          # 设了之后必须能 fopen + stat 成功。
          echo '::group::cjk-path shim redirects hard-coded paths'
          # The shim's logic is independent of where the target lives: compile the very
          # same source with CJK_NOTO/CJK_WQY pointed at a temp dir that holds the real
          # fonts, then assert the five hard-coded paths open through it (and that an
          # unrelated path still passes through). This runs on the runner (which has cc);
          # the app sandbox only ships the runtime and has no compiler.
          mkdir -p /tmp/cjk-fonts/app/share/fonts/noto-cjk /tmp/cjk-fonts/app/share/fonts/wqy
          flatpak run --command=cat "${APP_ID}" "${NOTO}" > /tmp/cjk-fonts/app/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
          flatpak run --command=cat "${APP_ID}" "${WQY}"  > /tmp/cjk-fonts/app/share/fonts/wqy/wqy-microhei.ttc
          sed 's#/app/share#/tmp/cjk-fonts/app/share#g' savagewind-cjk-path.c > /tmp/shim-test.c
          cc -shared -fPIC -O2 -o /tmp/shim-test.so /tmp/shim-test.c -ldl
          cat > /tmp/pathtest.c <<'EOF'
          #include <stdio.h>
          #include <sys/stat.h>
          int main(void) {
            const char *paths[] = {
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/google-noto-cjk/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
            };
            int open = 0;
            for (int i = 0; i < 5; i++) {
              FILE *f = fopen(paths[i], "rb"); struct stat st;
              if (f && stat(paths[i], &st) == 0) open++;
              if (f) fclose(f);
            }
            /* an unrelated path must NOT be rewritten (nothing at this fake target) */
            FILE *g = fopen("/app/bin/savagewind", "rb");
            printf("hard-coded CJK paths open: %d/5 ; unrelated path untouched: %s\n",
                   open, g ? "no(!)" : "yes");
            if (g) fclose(g);
            return (open == 5 && !g) ? 0 : 1;
          }
          EOF
          cc -O1 -o /tmp/pathtest /tmp/pathtest.c
          if LD_PRELOAD=/tmp/shim-test.so /tmp/pathtest; then
            echo 'ok: shim redirects all five hard-coded CJK paths, leaves other paths alone'
          else
            echo '::error::shim failed to redirect the hard-coded CJK paths'; exit 1
          fi
          echo '::endgroup::'

          # 关键断言：游戏内文本字体必须是 glyf 轮廓（不是 CFF），且含中日韩字形。
          echo '::group::SAVAGEWIND_FONT must be TrueType(glyf) + CJK'
          flatpak run --command=cat "${APP_ID}" "${WQY}" > /tmp/sw-wqy.ttc
          python3 - /tmp/sw-wqy.ttc <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          assert d[:4] == b'ttcf', 'not a TrueType collection'
          n = struct.unpack('>I', d[8:12])[0]
          off = struct.unpack('>I', d[12:16])[0]  # face 0 (pl.c 的 ttc_face0 只取 face 0)
          num = struct.unpack('>H', d[off + 4:off + 6])[0]
          tags = {}
          for i in range(num):
              r = off + 12 + 16 * i
              tags[d[r:r + 4].decode('latin1')] = (struct.unpack('>I', d[r + 8:r + 12])[0],
                                                   struct.unpack('>I', d[r + 12:r + 16])[0])
          assert 'glyf' in tags, 'face 0 has no glyf table (CFF?): the game font engine would crash'
          assert 'CFF ' not in tags, 'face 0 is CFF: the game font engine would crash'
          cmo = tags['cmap'][0]
          ntab = struct.unpack('>H', d[cmo + 2:cmo + 4])[0]
          base = None
          for i in range(ntab):
              so = struct.unpack('>I', d[cmo + 8 + 8 * i:cmo + 12 + 8 * i])[0]
              if struct.unpack('>H', d[cmo + so:cmo + so + 2])[0] == 12:
                  base = cmo + so
          ng = struct.unpack('>I', d[base + 12:base + 16])[0]
          rng = [(struct.unpack('>I', d[base + 16 + 12 * j:base + 20 + 12 * j])[0],
                  struct.unpack('>I', d[base + 20 + 12 * j:base + 24 + 12 * j])[0]) for j in range(ng)]
          has = lambda cp: any(s <= cp <= e for s, e in rng)
          for cp in (0x4E2D, 0x8BBE, 0x7F6E, 0x65E5, 0x3042, 0xAC00):
              assert has(cp), f'face 0 lacks U+{cp:04X}'
          print('SAVAGEWIND_FONT: TrueType(glyf) CJK face 0 ok')
          PY
          echo '::endgroup::'

          echo '::group::stb_truetype load (ImGui fonts)'
          cat > /tmp/fontcheck.c <<'EOF'
          #define STB_TRUETYPE_IMPLEMENTATION
          #include <stdio.h>
          #include <stdlib.h>
          #include "stb_truetype.h"
          int main(int argc, char **argv) {
            FILE *f = fopen(argv[1], "rb"); if (!f) { perror("open"); return 2; }
            fseek(f, 0, SEEK_END); long n = ftell(f); fseek(f, 0, SEEK_SET);
            if (n < 1024) { fprintf(stderr, "file too small: %ld bytes\n", n); return 5; }
            unsigned char *d = malloc(n);
            if (fread(d, 1, n, f) != (size_t)n) return 2;
            fclose(f);
            int off = stbtt_GetFontOffsetForIndex(d, 0);
            if (off < 0) { fprintf(stderr, "not an sfnt font (no valid face at index 0)\n"); return 3; }
            stbtt_fontinfo fi;
            if (!stbtt_InitFont(&fi, d, off)) return 3;
            const unsigned cps[] = {0x4E2D, 0x5934, 0x8BBE, 0x7F6E, 0x3042};
            for (int i = 0; i < 5; i++)
              if (!stbtt_FindGlyphIndex(&fi, cps[i])) { printf("missing U+%04X\n", cps[i]); return 4; }
            printf("ok: sfnt loaded, CJK glyphs present\n");
            return 0;
          }
          EOF
          curl -sSL -o /tmp/stb_truetype.h https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h
          cc -O1 -I/tmp -o /tmp/fontcheck /tmp/fontcheck.c -lm
          for FONT in "${NOTO}" "${WQY}"; do
            flatpak run --command=cat "${APP_ID}" "${FONT}" > /tmp/sw-font.bin
            echo "checking ${FONT}"
            /tmp/fontcheck /tmp/sw-font.bin
          done
          echo '::endgroup::'

          flatpak uninstall --user -y "${APP_ID}" || true

      - name: Compute checksum
        run: |
          set -eu
          sha256sum "${APP_ID}.flatpak" | tee sha256.txt
          SHA=$(sha256sum "${APP_ID}.flatpak" | awk '{print $1}')
          echo "SHA256_FULL=${SHA}  ${APP_ID}.flatpak" >> "$GITHUB_ENV"

      - name: Generate release notes
        run: |
          set -eu
          DATE=$(date +%Y%m%d)
          TAG=v${SAVAGEWIND_VERSION}-${DATE}
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Savage Wind ${SAVAGEWIND_VERSION} Flatpak (${TAG})" >> "$GITHUB_ENV"
          {
            echo "# Savage Wind Recomp Flatpak"
            echo ""
            echo "> 非官方 Flatpak 封装，直接打包上游官方 AppImage Release，不做源码编译。"
            echo ""
            echo "## 安装方法"
            echo ""
            echo '```bash'
            echo "# 下载 ${APP_ID}.flatpak 后："
            echo "flatpak install --user ${APP_ID}.flatpak"
            echo "flatpak run ${APP_ID}"
            echo '```'
            echo ""
            echo "## 重要提示"
            echo ""
            echo "**本包不含任何游戏文件、密钥或 DUMP 工具。** 你需要自备合法获得的《旷野之息》1.9.0 版 ExeFS / RomFS，"
            echo "首次启动时程序会要求选择目录，并在本机重新编译游戏代码（约 6 分钟起，取决于 CPU）。"
            echo ""
            echo "运行要求：x86-64 CPU（SSE4.2）、Vulkan 1.3 显卡驱动、16 GB 内存、约 20 GB 空闲磁盘。"
            echo ""
            echo "## 说明"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 应用 ID | \`${APP_ID}\` |"
            echo "| 上游版本 | Savage Wind **${SAVAGEWIND_VERSION}** (Alpha 5) |"
            echo "| 运行时 | org.freedesktop.Platform 25.08 |"
            echo "| 构建来源 | 上游官方 AppImage 解包封装 |"
            echo ""
            echo "## 数据目录"
            echo ""
            echo '```'
            echo "~/.var/app/${APP_ID}/data/savagewind   # 日志 / 配置 / 存档 / 已编译游戏库"
            echo '```'
            echo ""
            echo "## 文件校验 (SHA256)"
            echo '```'
            echo "${SHA256_FULL}"
            echo '```'
            echo ""
            echo "## 上游项目"
            echo ""
            echo "- 源码: https://github.com/Revivedx/SavageWindRecomp"
            echo "- Linux 说明: https://github.com/Revivedx/SavageWindRecomp/blob/main/docs/linux.md"
          } > release.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-flatpak
          path: ${{ env.APP_ID }}.flatpak
          retention-days: 14

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ github.workspace }}/release.txt
          files: ${{ github.workspace }}/${{ env.APP_ID }}.flatpak
          overwrite_files: true
