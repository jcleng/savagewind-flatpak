# Flatpak manifest for Savage Wind Recomp (Breath of the Wild static recompilation)
#
# 构建方式：直接解包上游官方 AppImage Release，不做源码编译。
# 上游项目：https://github.com/Revivedx/SavageWindRecomp
#
# 说明：本包不包含任何《塞尔达传说：旷野之息》的游戏文件。
# 用户必须自行提供合法获得的 1.9.0 版 ExeFS / RomFS，程序首次运行时会要求选择目录，
# 并在本机重新编译游戏代码（这一步需要本包内置的 zig 与 swgen）。
id: com.revivedx.SavageWind
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: savagewind-wrapper

finish-args:
  # 显示：Vulkan 交换链走 SDL3，x11 + wayland 都开
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # 音频
  - --socket=pulseaudio
  # 网络：上游的更新检查 / 遥测日志上报
  - --share=network
  # 显卡：Vulkan 1.3（游戏必需）
  - --device=dri
  # 手柄支持（--device=all 是访问 /dev/input 的必要条件）
  - --device=all
  # 截图 / 导入游戏文件时让用户从宿主目录挑选
  - --filesystem=host:ro
  # locale：沙箱默认只有 C.UTF-8，zh_CN 的 locale 数据不在 runtime 里，
  # 强行设 zh_CN.UTF-8 会导致 setlocale 失败并回退到 POSIX。
  # 程序界面跟随游戏内语言设置，C.UTF-8 即可正确按 UTF-8 解码中文文本。
  - --env=LANG=C.UTF-8
  - --env=LC_ALL=C.UTF-8

modules:
  # CJK 字体分两套、两个用途，原因见 README「中文显示」一节：
  #   * ImGui 界面（启动器 / 游戏内叠加菜单）：stb_truetype 解码，CFF(.otf) 也能读，用 Noto Sans SC。
  #   * 游戏内文本（走 nn::pl 系统共享字体）：游戏自己的字体引擎只能读 TrueType(glyf) 轮廓，
  #     CFF 会崩溃（见上游 runtime/hle/pl.c 的注释），所以必须用文泉驿微米黑（TrueType, 含简繁日韩）。
  # 两者都装进 /app/share/fonts，由包装脚本用环境变量指定真实路径，不依赖硬编码的 /usr/share/fonts。

  # Noto Sans CJK（CFF/OTTO 合集，10 faces）：仅用于 ImGui 界面。
  # 直接取 GitHub raw 上的 NotoSansCJK-Regular.ttc（与上游硬编码候选同名）。
  # 程序通过 SAVAGEWIND_MENU_FONT / SAVAGEWIND_LAUNCHER_FONT 拿真实路径去
  # AddFontFromFileTTF，不依赖任何硬编码路径。
  - name: noto-cjk-font
    buildsystem: simple
    build-commands:
      - install -Dm644 NotoSansCJK-Regular.ttc
          ${FLATPAK_DEST}/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/noto-cjk/LICENSE
      - |
        set -eu
        # 自检：确认是 stb_truetype(ImGui) 能识别的 sfnt 合集
        python3 - "${FLATPAK_DEST}/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc" <<'PY'
        import sys
        p = sys.argv[1]
        tag = open(p, 'rb').read(4)
        assert tag in (b'OTTO', b'\x00\x01\x00\x00', b'true', b'ttcf'), f'not an sfnt font: {tag!r}'
        print(f'{p}: sfnt tag={tag!r} ok')
        PY
    sources:
      - type: file
        url: https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Regular.ttc
        sha256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
        dest-filename: NotoSansCJK-Regular.ttc
      - type: file
        url: https://raw.githubusercontent.com/googlefonts/noto-cjk/main/LICENSE
        sha256: 6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2
        dest-filename: LICENSE

  # 文泉驿微米黑（TrueType/glyf）：给游戏内文本用（SAVAGEWIND_FONT）。
  # GitHub 上的副本，与上游 SourceForge 原始文件 sha256 一致
  # （e4bca8df...；Apache-2.0 或 GPL-3+ with Font exception，按 Apache-2.0 再分发）。
  # ttc 的 face 0 是「WenQuanYi Micro Hei」，含 GBK 汉字、假名、谚文，TrueType 轮廓，
  # 是游戏字体引擎（只要 glyf、遇 CFF 崩溃）能安全加载的最小可用中文字体。
  - name: wqy-microhei-font
    buildsystem: simple
    build-commands:
      - install -Dm644 wqy-microhei.ttc ${FLATPAK_DEST}/share/fonts/wqy/wqy-microhei.ttc
      - install -Dm644 LICENSE_Apache2.txt ${FLATPAK_DEST}/share/licenses/wqy-microhei/LICENSE_Apache2.txt
      - |
        set -eu
        # 自检：必须是 glyf 轮廓（游戏字体引擎读不了 CFF），且 face 0 含中日韩字形
        python3 - "${FLATPAK_DEST}/share/fonts/wqy/wqy-microhei.ttc" <<'PY'
        import struct, sys
        d = open(sys.argv[1], 'rb').read()
        assert d[:4] == b'ttcf', 'not a TrueType collection'
        n = struct.unpack('>I', d[8:12])[0]
        off = struct.unpack('>I', d[12:16])[0]  # face 0
        num = struct.unpack('>H', d[off + 4:off + 6])[0]
        tags = {}
        for i in range(num):
            r = off + 12 + 16 * i
            tags[d[r:r + 4].decode('latin1')] = (struct.unpack('>I', d[r + 8:r + 12])[0],
                                                 struct.unpack('>I', d[r + 12:r + 16])[0])
        assert 'glyf' in tags, 'face 0 has no glyf table (CFF?): the game font engine would crash'
        assert 'CFF ' not in tags, 'face 0 is a CFF font: the game font engine would crash'
        cmo = tags['cmap'][0]
        ntab = struct.unpack('>H', d[cmo + 2:cmo + 4])[0]
        base = None
        for i in range(ntab):
            so = struct.unpack('>I', d[cmo + 8 + 8 * i:cmo + 12 + 8 * i])[0]
            if struct.unpack('>H', d[cmo + so:cmo + so + 2])[0] == 12:
                base = cmo + so
        ng = struct.unpack('>I', d[base + 12:base + 16])[0]
        rng = [(struct.unpack('>I', d[base + 16 + 12 * j:base + 20 + 12 * j])[0],
                struct.unpack('>I', d[base + 20 + 12 * j:base + 24 + 12 * j])[0]) for j in range(ng)]
        has = lambda cp: any(s <= cp <= e for s, e in rng)
        for cp in (0x4E2D, 0x8BBE, 0x7F6E, 0x65E5, 0x3042, 0xAC00):  # 中设置日あ가
            assert has(cp), f'face 0 lacks U+{cp:04X}'
        assert n >= 1
        print(f'{sys.argv[1]}: TrueType(glyf) CJK face 0 ok, {n} faces')
        PY
    sources:
      - type: file
        url: https://raw.githubusercontent.com/anthonyfok/fonts-wqy-microhei/master/wqy-microhei.ttc
        sha256: e4bca8df123ce01b104780f576ea1a58b9a5ff1662a91124b6d3180cb6c88212
        dest-filename: wqy-microhei.ttc
      - type: file
        url: https://raw.githubusercontent.com/anthonyfok/fonts-wqy-microhei/master/LICENSE_Apache2.txt
        sha256: 1c19d8eb506a0e9d501d882fc9fe94eca99bc7b2f69f5e64fa79b7ec48cee54d
        dest-filename: LICENSE_Apache2.txt

  # Freedesktop SDK 不自带 unsquashfs，这里单独构建后保留在 /app/bin
  # （解包 AppImage 完毕后由 savagewind 模块在清理阶段删除）
  - name: squashfs-tools
    buildsystem: simple
    build-commands:
      - make -C squashfs-tools LZO_SUPPORT=0 XZ_SUPPORT=0 LZ4_SUPPORT=0 \
          ZSTD_SUPPORT=1 GZIP_SUPPORT=1
      - install -Dm755 squashfs-tools/unsquashfs /app/bin/unsquashfs
    sources:
      - type: archive
        url: https://github.com/plougher/squashfs-tools/archive/refs/tags/4.6.1.tar.gz
        sha256: 9c4974e07c61547dae14af4ed1f358b7d04618ae194e54d6be72ee126f0d2f53

  - name: savagewind
    buildsystem: simple
    build-commands:
      # 1. 解包 AppImage（offset 由 --appimage-offset 动态取得，按字节精确切分）
      - |
        set -eu
        # file source 下载后不带可执行位，必须先 chmod
        chmod +x ./SavageWind.appimage
        OFFSET=$(./SavageWind.appimage --appimage-offset)
        echo "AppImage squashfs offset = ${OFFSET}"
        python3 - "${OFFSET}" <<'PYEOF'
        import sys
        off = int(sys.argv[1])
        with open('SavageWind.appimage', 'rb') as src, open('sw.squashfs', 'wb') as dst:
            src.seek(off)
            while True:
                chunk = src.read(1 << 20)
                if not chunk:
                    break
                dst.write(chunk)
        PYEOF
        unsquashfs -q -d appimage-root sw.squashfs

      # 2. 安装主程序与随包文件到 /app/bin
      #    上游把 zig / swgen / vk_pipelines.seed / colour-luts 都放在 usr/bin，
      #    靠 $ORIGIN 相对查找，保持目录布局不变即可。
      - |
        set -eu
        install -d ${FLATPAK_DEST}/bin
        cp -a appimage-root/usr/bin/. ${FLATPAK_DEST}/bin/
        # 主程序必须留在 bin，包装脚本只负责环境准备后 exec 它
        test -x ${FLATPAK_DEST}/bin/savagewind
        test -x ${FLATPAK_DEST}/bin/zig/zig
        test -x ${FLATPAK_DEST}/bin/swgen/swgen

      # 3. 安装自带的私有共享库（RUNPATH = $ORIGIN/../lib）
      - |
        set -eu
        install -d ${FLATPAK_DEST}/lib
        cp -a appimage-root/usr/lib/. ${FLATPAK_DEST}/lib/

      # 4. 图标与桌面入口
      - install -Dm644 com.revivedx.SavageWind.png
        ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.revivedx.SavageWind.png
      - install -Dm644 com.revivedx.SavageWind.desktop
        ${FLATPAK_DEST}/share/applications/com.revivedx.SavageWind.desktop
      - install -Dm644 com.revivedx.SavageWind.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/com.revivedx.SavageWind.metainfo.xml

      # 5. 启动包装脚本
      - install -Dm755 savagewind-wrapper ${FLATPAK_DEST}/bin/savagewind-wrapper

      # 6. 清理：不在最终包里保留解包工具和 AppImage 外层壳
      - rm -f ${FLATPAK_DEST}/bin/unsquashfs
        sw.squashfs appimage-root/AppRun appimage-root/savagewind.desktop
        appimage-root/savagewind.png appimage-root/.DirIcon

    sources:
      - type: file
        url: https://github.com/Revivedx/SavageWindRecomp/releases/download/v0.5.0-alpha.5/Savage_Wind-0.5.0-alpha.5-x86_64.AppImage
        sha256: 6200777861a3e8949c9edc7a73d6b678ceaea0519a13e8a1baebbfb755586ae2
        dest-filename: SavageWind.appimage
      - type: file
        path: icons/com.revivedx.SavageWind.png
        dest-filename: com.revivedx.SavageWind.png
      - type: file
        path: com.revivedx.SavageWind.desktop
      - type: file
        path: com.revivedx.SavageWind.metainfo.xml
      - type: file
        path: savagewind-wrapper
